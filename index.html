<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Door entry</title>
<style>
  :root { --bg: #f4f5f7; --card: #ffffff; --ink: #1c2330; --muted: #5d6675; --accent: #1f6feb; --bar: #dde2ea; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 360px; text-align: center; }
  .card { background: var(--card); border-radius: 20px; padding: 24px 20px; box-shadow: 0 2px 14px rgba(20, 30, 50, .12); }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  .member { color: var(--muted); font-size: .95rem; margin: 0 0 18px; }
  #qr { background: #ffffff; padding: 14px; border-radius: 12px; display: inline-block; line-height: 0; border: 1px solid var(--bar); }
  #qr img, #qr canvas { max-width: 100%; height: auto; }
  .bar { height: 6px; background: var(--bar); border-radius: 3px; margin: 18px 6px 8px; overflow: hidden; }
  .bar > div { height: 100%; width: 100%; background: var(--accent); transition: width .25s linear; }
  .hint { color: var(--muted); font-size: .9rem; margin: 10px 0 0; line-height: 1.4; }
  .error { color: #b3261e; font-weight: 600; }
  button { margin-top: 18px; background: none; border: none; color: var(--muted); font-size: .8rem; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Rockfield door entry</h1>
    <p class="member" id="member"></p>
    <div id="view"></div>
  </div>
  <button id="forget" hidden>Remove saved link from this phone</button>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* crypto-start */
function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }

var K256 = [
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
];

function sha256(bytes) {
  var h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  var len = bytes.length;
  var padded = ((len + 9 + 63) >> 6) << 6;
  var m = new Uint8Array(padded);
  m.set(bytes);
  m[len] = 0x80;
  var bitsHi = Math.floor(len / 0x20000000), bitsLo = (len << 3) >>> 0;
  m[padded - 8] = (bitsHi >>> 24) & 255; m[padded - 7] = (bitsHi >>> 16) & 255;
  m[padded - 6] = (bitsHi >>> 8) & 255;  m[padded - 5] = bitsHi & 255;
  m[padded - 4] = (bitsLo >>> 24) & 255; m[padded - 3] = (bitsLo >>> 16) & 255;
  m[padded - 2] = (bitsLo >>> 8) & 255;  m[padded - 1] = bitsLo & 255;
  var w = new Array(64);
  for (var off = 0; off < padded; off += 64) {
    var i;
    for (i = 0; i < 16; i++) {
      w[i] = ((m[off + 4 * i] << 24) | (m[off + 4 * i + 1] << 16) | (m[off + 4 * i + 2] << 8) | m[off + 4 * i + 3]) | 0;
    }
    for (i = 16; i < 64; i++) {
      var s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      var s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    var a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
    for (i = 0; i < 64; i++) {
      var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      var ch = (e & f) ^ (~e & g);
      var t1 = (hh + S1 + ch + K256[i] + w[i]) | 0;
      var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      var maj = (a & b) ^ (a & c) ^ (b & c);
      var t2 = (S0 + maj) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
    h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
  }
  var out = new Uint8Array(32);
  for (i = 0; i < 8; i++) {
    out[4 * i] = (h[i] >>> 24) & 255; out[4 * i + 1] = (h[i] >>> 16) & 255;
    out[4 * i + 2] = (h[i] >>> 8) & 255; out[4 * i + 3] = h[i] & 255;
  }
  return out;
}

function hmacSha256(key, msg) {
  if (key.length > 64) key = sha256(key);
  var ipad = new Uint8Array(64 + msg.length), opad = new Uint8Array(96);
  for (var i = 0; i < 64; i++) {
    var k = i < key.length ? key[i] : 0;
    ipad[i] = k ^ 0x36;
    opad[i] = k ^ 0x5c;
  }
  ipad.set(msg, 64);
  opad.set(sha256(ipad), 64);
  return sha256(opad);
}

function hexToBytes(hex) {
  var out = new Uint8Array(hex.length / 2);
  for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(2 * i, 2), 16);
  return out;
}

/* 8-digit code for one 30-second step; matches totp() in ebo_members.py */
function totp(secret, counter) {
  var msg = new Uint8Array(8);
  var hi = Math.floor(counter / 4294967296), lo = counter % 4294967296;
  msg[0] = (hi >>> 24) & 255; msg[1] = (hi >>> 16) & 255; msg[2] = (hi >>> 8) & 255; msg[3] = hi & 255;
  msg[4] = (lo >>> 24) & 255; msg[5] = (lo >>> 16) & 255; msg[6] = (lo >>> 8) & 255; msg[7] = lo & 255;
  var mac = hmacSha256(secret, msg);
  var off = mac[31] & 15;
  var bin = (mac[off] & 0x7f) * 16777216 + (mac[off + 1] << 16) + (mac[off + 2] << 8) + mac[off + 3];
  var s = String(bin % 100000000);
  while (s.length < 8) s = "0" + s;
  return s;
}
/* crypto-end */

var STEP = 30;
var STORE_KEY = "door-entry-link";
var link = null;       // { n: membership number, s: secret as hex }
var qr = null;
var lastCounter = -1;

function readStored() {
  try {
    var raw = window.localStorage.getItem(STORE_KEY);
    var v = raw && JSON.parse(raw);
    if (v && /^\d{1,9}$/.test(v.n) && /^[0-9a-f]{64}$/i.test(v.s)) return v;
  } catch (e) { /* storage unavailable */ }
  return null;
}

function store(v) {
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch (e) { /* ignore */ }
}

function loadLink() {
  var m = /^#(\d{1,9})\.([0-9a-f]{64})$/i.exec(window.location.hash);
  if (m) {
    link = { n: m[1], s: m[2].toLowerCase() };
    store(link);
    // Remove the secret from the address bar and history
    try { window.history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e) { /* ignore */ }
  } else {
    link = readStored();
  }
}

var view = document.getElementById("view");
var memberEl = document.getElementById("member");
var forgetBtn = document.getElementById("forget");

function showMessage(html) {
  view.innerHTML = '<p class="hint">' + html + "</p>";
}

function render() {
  var now = Math.floor(Date.now() / 1000);
  var counter = Math.floor(now / STEP);
  if (counter !== lastCounter) {
    lastCounter = counter;
    var payload = "EBOQR:" + link.n + ":" + totp(hexToBytes(link.s), counter);
    if (qr) { qr.makeCode(payload); }
    else {
      document.getElementById("qr").innerHTML = "";
      qr = new QRCode(document.getElementById("qr"), {
        text: payload, width: 240, height: 240,
        colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M
      });
    }
  }
  var left = STEP - (now % STEP);
  document.getElementById("bar").style.width = Math.max(4, (left / STEP) * 100) + "%";
}

function keepAwake() {
  try {
    if ("wakeLock" in navigator) navigator.wakeLock.request("screen").catch(function () {});
  } catch (e) { /* ignore */ }
}

function start() {
  loadLink();
  if (!link) {
    showMessage("Open your personal door entry link to set up this phone. " +
      "Ask the club if you have not received one.");
    return;
  }
  if (typeof QRCode === "undefined") {
    showMessage('<span class="error">The QR code could not be drawn.</span> ' +
      "Check your internet connection and reload the page.");
    return;
  }
  memberEl.textContent = "Membership no. " + link.n;
  view.innerHTML = '<div id="qr"></div><div class="bar"><div id="bar"></div></div>' +
    '<p class="hint">Hold your screen up to the scanner at the door.<br>' +
    "Turn your screen brightness up if it does not read.</p>";
  forgetBtn.hidden = false;
  render();
  window.setInterval(render, 250);
  keepAwake();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) keepAwake(); });
}

forgetBtn.addEventListener("click", function () {
  try { window.localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
  window.location.reload();
});

start();
</script>
</body>
</html>
