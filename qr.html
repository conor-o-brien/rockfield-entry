  .hint { color: var(--muted); font-size: .9rem; margin: 10px 0 0; line-height: 1.4; }
  .error { color: #b3261e; font-weight: 600; }

  input.link { width: 100%; margin-top: 14px; padding: 12px; border: 1px solid var(--bar); border-radius: 10px; font-size: 1rem; }
  #install { margin-top: 14px; color: var(--muted); font-size: .85rem; line-height: 1.4; }
  #install[hidden] { display: none; }
  #install button { margin: 0; }
  button.primary { background: var(--accent); color: #ffffff; text-decoration: none; font-size: 1rem; font-weight: 600; padding: 12px 18px; border-radius: 12px; width: 100%; }

function validState(v) {
  return !!v && /^\d{1,9}$/.test(v.n) && /^[0-9a-f]{32}$/.test(v.d) &&
    (v.p === "active" || (v.p === "enroll" && /^[0-9a-f]{32}$/.test(v.t)));
}

function readStored() {
  try {
    var v = JSON.parse(window.localStorage.getItem(STORE_KEY));
    if (validState(v)) return v;
  } catch (e) { /* storage unavailable or empty */ }
  return null;
}

function store(v) {
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch (e) { /* ignore */ }
}

function clearAddressBar() {
  try { window.history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e) { /* ignore */ }
}

function adoptLink(number, token) {
  token = token.toLowerCase();
  // Opening the same link again must not undo an activation already done on this phone
  if (state && state.n === number && (state.t === token || state.u === token)) return;
  state = { n: number, d: randomHex(16), t: token, p: "enroll" };
  store(state);
}

// Returns "old" for a link from an earlier version of this page, otherwise null
function loadState() {
  var hash = window.location.hash;
  var m = /^#(\d{1,9})\.([0-9a-f]{32})$/i.exec(hash);
  state = readStored();
  if (m) {
    clearAddressBar();
    adoptLink(m[1], m[2]);
    return null;
  }
  if (/^#\d{1,9}\.[0-9a-f]{64}$/i.test(hash)) { clearAddressBar(); return "old"; }
  return null;
}

function showMessage(html) {
  memberEl.textContent = "";
  view.innerHTML = '<p class="hint">' + html + "</p>";
}

function drawQr(text, size) {
  var box = document.getElementById("qr");
  box.innerHTML = "";
  qr = new QRCode(box, {
    text: text, width: size, height: size,
    colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M
  });
}

// No saved link on this phone (for example the first time the installed app is opened)
function showSetup() {
  memberEl.textContent = "";
  view.innerHTML = '<p class="hint">Open your personal door entry link to set up this phone, ' +
    "or paste it here. Ask the club if you have not received one.</p>" +
    '<input id="paste" class="link" type="text" inputmode="url" autocomplete="off" ' +
    'autocapitalize="off" spellcheck="false" placeholder="Paste your door entry link">' +
    '<button id="use" class="primary">Use this link</button>' +
    '<p id="pasteErr" class="hint error" hidden>That is not a door entry link. Copy the whole link from the email.</p>';
  document.getElementById("use").addEventListener("click", function () {
    var m = /#(\d{1,9})\.([0-9a-f]{32})(?![0-9a-f])/i.exec(document.getElementById("paste").value);
    if (!m) { document.getElementById("pasteErr").hidden = false; return; }
    adoptLink(m[1], m[2]);
    forgetBtn.hidden = false;
    showEnroll();
  });
}

function showEnroll() {
  memberEl.textContent = "Membership no. " + state.n;
  view.innerHTML = '<div id="qr"></div>' +
    '<p class="hint"><strong>Step 1.</strong> Hold this screen up to the scanner at the door, once.<br>' +
    "<strong>Step 2.</strong> Then tap the button below.</p>" +
    '<button id="done" class="primary">I have scanned it, show my code</button>';
  drawQr("EBOQR:E:" + state.n + ":" + state.t + ":" + state.d, 260);
  document.getElementById("done").addEventListener("click", function () {
    state = { n: state.n, d: state.d, p: "active", u: state.t };
    store(state);
    showCodes();
  });
}

function render() {
  var now = Math.floor(Date.now() / 1000);
  var counter = Math.floor(now / STEP);
  if (counter !== lastCounter) {
    lastCounter = counter;
    var payload = "EBOQR:" + state.n + ":" + totp(hexToBytes(state.d), counter);
    if (qr) { qr.makeCode(payload); } else { drawQr(payload, 240); }
  }
  var left = STEP - (now % STEP);
  document.getElementById("bar").style.width = Math.max(4, (left / STEP) * 100) + "%";
}

function keepAwake() {
  try {
    if ("wakeLock" in navigator) navigator.wakeLock.request("screen").catch(function () {});
  } catch (e) { /* ignore */ }
}

function showCodes() {
  memberEl.textContent = "Membership no. " + state.n;
  view.innerHTML = '<div id="qr"></div><div class="bar"><div id="bar"></div></div>' +
    '<p class="hint">Hold your screen up to the scanner at the door.<br>' +
    "Turn your screen brightness up if it does not read.</p>";
  qr = null;
  lastCounter = -1;
  render();
  if (timer) window.clearInterval(timer);
  timer = window.setInterval(render, 250);
  keepAwake();
}

function start() {
  var problem;
  try { problem = loadState(); } catch (e) {
    showMessage("This browser is too old to set up door entry. Try another browser.");
    return;
  }
  if (problem === "old") {
    showMessage("This link is from an older version and no longer works. " +
      "Ask the club for a new door entry link.");
    return;
  }
  if (typeof QRCode === "undefined") {
    showMessage('<span class="error">The QR code could not be drawn.</span> ' +
      "Check your internet connection and reload the page.");
    return;
  }
  if (!state) { showSetup(); return; }
  forgetBtn.hidden = false;
  document.addEventListener("visibilitychange", function () { if (!document.hidden) keepAwake(); });
  if (state.p === "enroll") showEnroll(); else showCodes();
}

forgetBtn.addEventListener("click", function () {
  try { window.localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
  window.location.reload();
});

start();

// ---- Install as an app -------------------------------------------------------
var installBox = document.getElementById("install");
var installEvent = null;
var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
  window.navigator.standalone === true;
var isApple = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

if (!standalone) {
  installBox.hidden = false;
  installBox.textContent = isApple
    ? "To install: tap the Share button, then Add to Home Screen. " +
      "Install before you scan your setup code at the door, then open the app and paste your link."
    : "To install: open the browser menu and choose Install app or Add to Home screen.";
}

window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault();
  installEvent = e;
  installBox.hidden = false;
  installBox.innerHTML = '<button id="installBtn" class="primary">Install as an app</button>';
  document.getElementById("installBtn").addEventListener("click", function () {
    installEvent.prompt();
    installEvent = null;
    installBox.hidden = true;
  });
});
window.addEventListener("appinstalled", function () { installBox.hidden = true; });

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* page still works online */ });
  });
}
</script>
</body>
</html>
